[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "blackboard-downloader"
version = "0.1.0.dev0"
description = "Download Blackboard course files and folders while preserving their hierarchy."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.28,<1",
    "playwright>=1.49,<2",
    "python-dotenv>=1.0,<2",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["blackboard_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
